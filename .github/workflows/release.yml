name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Kiadás címkéje (pl. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    strategy:
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v5

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verzió kiolvasása a címkéből
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            '${{ github.event.inputs.tag }}'
          }
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Önálló, egyfájlos kiadás: a felhasználónak semmit nem kell telepítenie.
      # A ReadyToRun a hidegindítást rövidíti — fájlkezelőnél ez a legfontosabb
      # metrika, cserébe nagyobb a fájl.
      - name: Publish
        run: >
          dotnet publish src/Pilaster.App
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.runtime }}

      - name: Csomagolás
        shell: pwsh
        run: |
          $name = "Pilaster-${{ steps.version.outputs.tag }}-${{ matrix.runtime }}"
          Compress-Archive -Path "publish/${{ matrix.runtime }}/*" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash | Out-File "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: |
            *.zip
            *.sha256

  release:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
